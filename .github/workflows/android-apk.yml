# Builds the Android app. Every push that touches it gets an APK as a
# workflow artifact; a version tag also attaches one to the release, beside
# the Windows package.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # The secrets context cannot be read in an `if`, so the key's presence
    # travels as an environment variable.
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Its default package list still names the long-gone "tools" package,
      # so nothing is installed here; the two below are what a build needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      # chiaki generates its protocol code at build time with python-protobuf.
      - name: Build-time tools for libchiaki
        run: |
          python3 -m pip install --upgrade protobuf
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      # The release build is signed with the repository's key when it has
      # one; without it the APK carries the debug signature, which is enough
      # to install by hand but not to update over a differently signed copy.
      - name: Set up the signing key
        if: ${{ env.KEYSTORE != '' }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > app/release.jks
          {
            echo "P5M_STORE_FILE=release.jks"
            echo "P5M_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "P5M_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "P5M_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Name the file after the version
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="${GITHUB_SHA::7}"
          src=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          out="P5Manager-$version.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: p5manager-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
