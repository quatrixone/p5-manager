name: App bundle

# Builds the bundles the in-app Update installs - one for Docker, one for the
# Windows package (see scripts/build-app-bundle.mjs) - updates a running app
# from one as a check, and attaches them to the release of a version tag.
# A manual run or a push to main does everything but the attaching.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-app-bundle.mjs'
      - 'scripts/update-check.mjs'
      - '.github/workflows/app-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 like the Windows build: the test scripts use a glob that
          # `node --test` only understands from Node 21 on.
          node-version: 22

      - name: Install dependencies
        run: |
          # cd, not --prefix: a dependency's install script runs npx, which
          # would pick the prefix up and look for its files in the wrong place.
          (cd backend && npm ci --no-audit --no-fund)
          (cd frontend && npm ci --no-audit --no-fund)

      - name: Tests
        run: |
          (cd backend && npm test)
          (cd frontend && npm test)

      - name: Build the bundles
        run: node scripts/build-app-bundle.mjs dist-bundle

      - name: Update a running app from a bundle
        run: |
          # Same code, higher version, served locally the way GitHub would.
          node scripts/build-app-bundle.mjs "$RUNNER_TEMP/bundles" --no-build --version 99.0.0
          export DATA_DIR="$RUNNER_TEMP/p5m-data" USER_DATA_DIR="$RUNNER_TEMP/p5m-user" PORT=3901
          export P5M_UPDATE_FEED=http://127.0.0.1:39918/latest
          # Stands in for the container's restart policy.
          # (`|| code=$?` because the step runs under `bash -e`, which would
          # otherwise end the loop at the first non-zero exit.)
          (cd backend && while true; do code=0; node src/index.js || code=$?; [ "$code" -eq 75 ] || break; done) > "$RUNNER_TEMP/app.log" 2>&1 &
          node scripts/update-check.mjs http://127.0.0.1:3901 "$RUNNER_TEMP/bundles" 99.0.0 || { tail -60 "$RUNNER_TEMP/app.log"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: dist-bundle/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bundle/*
