name: Windows portable

# Builds P5Manager-windows-x64.zip: the app, a private Node and Python
# runtime and P5Manager.exe, so it runs on Windows without Docker. The
# packaged app is started on the runner and exercised end to end
# (scripts/smoke.mjs) before the zip is published.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'pyremoteplay/**'
      - 'rpnative/**'
      - 'packaging/**'
      - 'scripts/smoke.mjs'
      - '.github/workflows/windows-portable.yml'
    tags: ['v*']
  workflow_dispatch:

# The release step uploads the zip to the GitHub Release of a version tag.
permissions:
  contents: write

env:
  NODE_VERSION: '22.20.0'
  PYTHON_VERSION: '3.11.9'
  SEVENZIP_VERSION: '25.01'
  SEVENZIP_SHA256: '78AFA2A1C773CAF3CF7EDF62F857D2A8A5DA55FB0FFF5DA416074C0D28B2B55F'
  SEVENZIP_7ZR_SHA256: '27CBE3D5804AD09E90BBCAA916DA0D5C3B0BE9462D0E0FB6CB54BE5ED9030875'

jobs:
  # p5rp, the Remote Play session helper (rpnative/, built with MSYS2).
  p5rp:
    uses: ./.github/workflows/rp-native.yml

  build:
    needs: p5rp
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: p5rp-windows-x64
          path: p5rp-windows

      - name: Unit tests
        shell: pwsh
        run: |
          Push-Location backend;  npm ci; npm test; Pop-Location
          Push-Location frontend; npm ci; npm test; Pop-Location

      - name: Build web UI
        shell: pwsh
        run: |
          Push-Location frontend; npm run build; Pop-Location
          if (-not (Test-Path backend/dist/index.html)) { throw "frontend build did not produce backend/dist" }

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "dist-portable/P5Manager"
          New-Item -ItemType Directory -Force "$out/app/backend", "$out/app/pyremoteplay", "$out/runtime/node", "$out/runtime/python" | Out-Null

          # Backend: sources, built UI, production dependencies only.
          Copy-Item backend/src "$out/app/backend/src" -Recurse
          Copy-Item backend/dist "$out/app/backend/dist" -Recurse
          Copy-Item backend/package.json, backend/package-lock.json, backend/image-level, backend/deps-hash.mjs "$out/app/backend/"
          Get-ChildItem "$out/app/backend/src" -Recurse -Filter *.test.js | Remove-Item
          Push-Location "$out/app/backend"; npm ci --omit=dev --no-audit --no-fund; Pop-Location
          Copy-Item frontend/builtin "$out/app/builtin" -Recurse
          # The app's own payloads, put into data\payloads on the first start.
          New-Item -ItemType Directory -Force "$out/app/backend/vendored" | Out-Null
          Copy-Item p5managerclient/rp-get-pin/rp-get-pin.elf, p5managerclient/offact/offact.elf, p5managerclient/pkg-install/pkg-install.elf "$out/app/backend/vendored/"

          # 7-Zip, for the archives the app extracts (7z, zip, rar): the launcher
          # puts this folder on the server's PATH. Both downloads are pinned.
          $z = "$env:RUNNER_TEMP\7zip-dl"
          New-Item -ItemType Directory -Force $z, "$out/runtime/7zip" | Out-Null
          foreach ($f in @{ name = '7zr.exe'; sha = $env:SEVENZIP_7ZR_SHA256 }, @{ name = "7z$($env:SEVENZIP_VERSION.Replace('.', ''))-x64.exe"; sha = $env:SEVENZIP_SHA256 }) {
            Invoke-WebRequest "https://github.com/ip7z/7zip/releases/download/$env:SEVENZIP_VERSION/$($f.name)" -OutFile "$z\$($f.name)"
            if ((Get-FileHash "$z\$($f.name)" -Algorithm SHA256).Hash -ne $f.sha) { throw "$($f.name) does not match its pinned checksum" }
          }
          & "$z\7zr.exe" x "$z\7z$($env:SEVENZIP_VERSION.Replace('.', ''))-x64.exe" "-o$out\runtime\7zip" 7z.exe 7z.dll License.txt -y | Out-Null
          if (-not (Test-Path "$out/runtime/7zip/7z.exe")) { throw "7z.exe was not extracted" }

          # Node runtime (same version the tests above ran on).
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/win-x64/node.exe" -OutFile "$out/runtime/node/node.exe"

          # Python: the embeddable distribution plus the Remote Play service's
          # dependencies, installed by the matching full Python on the runner.
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip "$out/runtime/python"
          python -m pip install --upgrade pip
          python -m pip install -r pyremoteplay/requirements.txt --target "$out/runtime/python/Lib/site-packages" --no-compile
          # The embeddable Python only looks where its ._pth file says.
          $pth = Get-ChildItem "$out/runtime/python" -Filter "python*._pth" | Select-Object -First 1
          Set-Content $pth.FullName -Encoding ascii -Value @("python311.zip", ".", "Lib\site-packages", "..\..\app\pyremoteplay", "import site")
          Copy-Item pyremoteplay/server.py, pyremoteplay/chiaki_engine.py, pyremoteplay/ddp.py, pyremoteplay/psn_oauth.py "$out/app/pyremoteplay/"
          # p5rp and the MSYS2 DLLs it needs, where chiaki_engine.find_helper()
          # looks: <home>\runtime\p5rp. AGPL - its licence goes along.
          New-Item -ItemType Directory -Force "$out/runtime/p5rp" | Out-Null
          Copy-Item p5rp-windows/* "$out/runtime/p5rp/"
          Copy-Item rpnative/LICENSE "$out/runtime/p5rp/LICENSE.txt"
          if (-not (Test-Path "$out/runtime/p5rp/p5rp.exe")) { throw "p5rp.exe is missing" }
          # Which Python packages this service was built with: an in-app update
          # brings a newer service only when it was built against the same ones.
          node -e "import('./backend/deps-hash.mjs').then(m => process.stdout.write(m.fileHash('pyremoteplay/requirements.txt')))" | Set-Content "$out/app/pyremoteplay/pydeps"
          if (-not (Get-Content "$out/app/pyremoteplay/pydeps")) { throw "could not fingerprint requirements.txt" }

          # Launcher, built with the C# compiler that ships with Windows. Its
          # icon is the app's (frontend/public/icon-512.svg drawn at 16 to 256 px).
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize+ /target:exe /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /win32icon:packaging\windows\P5Manager.ico "/out:$out\P5Manager.exe" packaging\windows\P5Manager.cs
          if ($LASTEXITCODE -ne 0) { throw "launcher did not compile" }
          Copy-Item packaging/windows/README.txt "$out/README.txt"

      - name: Pack app and runtime into one file
        shell: pwsh
        run: |
          # Windows Explorer extracts a zip file by file, and with thousands of
          # small ones that takes minutes. So the download holds three files -
          # the launcher, the README and P5Manager.pak, a zip of app\ and
          # runtime\ - and the launcher unpacks the pak on the first start,
          # which is many times faster.
          $ErrorActionPreference = 'Stop'
          $out = "dist-portable/P5Manager"

          # First drop what is never read at run time.
          $nm = "$out/app/backend/node_modules"
          $before = (Get-ChildItem $out -Recurse -File -Force).Count
          Remove-Item "$nm/.bin" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $nm -Recurse -Directory -Force -Filter .github | Remove-Item -Recurse -Force
          # Native add-ons built for other systems.
          Get-ChildItem $nm -Recurse -Directory -Filter prebuilds | Get-ChildItem -Directory |
            Where-Object { $_.Name -notlike 'win32-x64*' } | Remove-Item -Recurse -Force
          # Docs, source maps, TypeScript and editor settings - licence files stay.
          $ext = '.md', '.markdown', '.map', '.ts', '.mts', '.cts', '.tsbuildinfo', '.bare'
          $dot = '.npmignore', '.editorconfig', '.eslintrc', '.eslintrc.js', '.eslintrc.json', '.prettierrc', '.nycrc', '.travis.yml', '.gitattributes'
          Get-ChildItem $nm -Recurse -File -Force |
            Where-Object { $_.Name -notmatch '^(licen[sc]e|notice|copying|authors|patents)' -and ($_.Extension -in $ext -or $_.Name -in $dot) } |
            Remove-Item -Force
          $sp = "$out/runtime/python/Lib/site-packages"
          Get-ChildItem $sp -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Get-ChildItem $sp -Recurse -File | Where-Object { $_.Extension -in '.pyi', '.pxd', '.pyx', '.h', '.c', '.cpp' } | Remove-Item -Force
          $after = (Get-ChildItem $out -Recurse -File -Force).Count
          "trimmed $before files to $after"

          New-Item -ItemType Directory -Force dist-portable/pak, dist-zip/P5Manager | Out-Null
          Move-Item "$out/app", "$out/runtime" dist-portable/pak
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path dist-portable/pak).Path, (Join-Path (Resolve-Path $out).Path 'P5Manager.pak'), [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Remove-Item dist-portable/pak -Recurse -Force
          "P5Manager.pak: {0:N0} MB" -f ((Get-Item "$out/P5Manager.pak").Length / 1MB)
          # What gets published, set aside before the tests below unpack it.
          Copy-Item "$out/P5Manager.exe", "$out/README.txt", "$out/P5Manager.pak" dist-zip/P5Manager

      - name: Unpack like a first start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Resolve-Path "dist-portable/P5Manager"
          & "$app\P5Manager.exe" --prepare
          if ($LASTEXITCODE -ne 0) { throw "the launcher could not unpack P5Manager.pak" }
          if (Test-Path "$app\P5Manager.pak") { throw "P5Manager.pak is still there after unpacking" }
          foreach ($f in "runtime\node\node.exe", "runtime\python\python.exe", "runtime\p5rp\p5rp.exe", "app\backend\src\index.js", "app\pyremoteplay\server.py") {
            if (-not (Test-Path "$app\$f")) { throw "$f is missing after unpacking" }
          }

      - name: Remote Play service imports
        shell: pwsh
        run: |
          $py = "dist-portable/P5Manager/runtime/python/python.exe"
          & $py -c "import sys, av, PIL, fastapi, uvicorn, aiohttp, chiaki_engine, ddp, psn_oauth; print('python', sys.version.split()[0], 'av', av.__version__, 'p5rp', chiaki_engine.find_helper())"
          if ($LASTEXITCODE -ne 0) { throw "bundled Python cannot import the Remote Play service's modules" }
          & $py -c "import chiaki_engine, sys; sys.exit(0 if chiaki_engine.find_helper() else 1)"
          if ($LASTEXITCODE -ne 0) { throw "the Remote Play service does not find p5rp.exe" }
          # p5rp starts (its usage line, exit code 2) - all its DLLs are there.
          # Not through a pipeline: cut short by Select-Object, PowerShell
          # reports exit code 0 whatever the program returned.
          $p = Start-Process "dist-portable/P5Manager/runtime/p5rp/p5rp.exe" -NoNewWindow -Wait -PassThru -RedirectStandardError "$env:RUNNER_TEMP\p5rp.err" -RedirectStandardOutput "$env:RUNNER_TEMP\p5rp.out"
          Get-Content "$env:RUNNER_TEMP\p5rp.err" | Select-Object -First 1
          if ($p.ExitCode -ne 2) { throw "p5rp.exe does not start (exit $($p.ExitCode)) - a DLL is missing?" }

      - name: Start the packaged app and run the smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Resolve-Path "dist-portable/P5Manager"
          $log = "$env:RUNNER_TEMP\p5manager.log"
          $proc = Start-Process "$app\P5Manager.exe" -ArgumentList "--no-browser" -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          try {
            $up = $false
            foreach ($i in 1..90) {
              try { if ((Invoke-WebRequest "http://127.0.0.1:3001/api/health" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $up = $true; break } } catch {}
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $up) { throw "P5 Manager did not come up" }
            node scripts/smoke.mjs http://127.0.0.1:3001 "$env:RUNNER_TEMP\p5m-smoke" --sidecar
            if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
            if (-not (Test-Path "$app\data\app\p5manager.db")) { throw "database was not created in the portable data folder" }
            # The launcher has to notice that the server is up, or the user's
            # browser opens late: it once took minutes over a server that
            # answered after two seconds.
            $ready = $false
            foreach ($i in 1..20) {
              if ((Get-Content $log -Raw) -match 'P5 Manager is ready') { $ready = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "the launcher did not report the app as ready" }
          }
          finally {
            Write-Host "---- launcher / server log ----"
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            if (Test-Path "$log.err") { Get-Content "$log.err" -Tail 40 }
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          # Killing the launcher must take the server and the service with it.
          Start-Sleep -Seconds 3
          $left = Get-Process node, python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app*" }
          if ($left) { throw "child processes survived the launcher: $($left.Id -join ', ')" }

      - name: Update the packaged app from inside
        shell: pwsh
        run: |
          # The app updates itself from a release's bundle. Build one with a
          # higher version, serve it locally the way GitHub would, and let the
          # packaged app install it: the launcher has to start the new code and
          # the Remote Play service that came with it.
          $ErrorActionPreference = 'Stop'
          $app = Resolve-Path "dist-portable/P5Manager"
          $bundles = "$env:RUNNER_TEMP\bundles"
          node scripts/build-app-bundle.mjs $bundles --no-build --version 99.0.0
          if ($LASTEXITCODE -ne 0) { throw "bundle did not build" }
          $log = "$env:RUNNER_TEMP\p5manager-update.log"
          $env:P5M_UPDATE_FEED = "http://127.0.0.1:39918/latest"
          $proc = Start-Process "$app\P5Manager.exe" -ArgumentList "--no-browser" -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          try {
            node scripts/update-check.mjs http://127.0.0.1:3001 $bundles 99.0.0 --sidecar
            if ($LASTEXITCODE -ne 0) { throw "the in-app update did not work" }
            $text = Get-Content $log -Raw
            if ($text -notmatch 'restarting P5 Manager after an update') { throw "the launcher did not restart the app" }
            if ($text -notmatch 'Remote Play service on 127\.0\.0\.1:\d+ \(updated copy\)') { throw "the updated Remote Play service was not started" }
          }
          finally {
            Write-Host "---- launcher / server log ----"
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            if (Test-Path "$log.err") { Get-Content "$log.err" -Tail 40 }
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Remove-Item Env:P5M_UPDATE_FEED
          }
          Start-Sleep -Seconds 3

      - name: Zip
        shell: pwsh
        run: |
          # The pak is compressed already; stored, the zip extracts like a copy.
          Compress-Archive -Path "dist-zip/P5Manager" -DestinationPath "P5Manager-windows-x64.zip" -CompressionLevel NoCompression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path P5Manager-windows-x64.zip).Path)
          $files = @($zip.Entries | Where-Object { $_.Name })
          $zip.Dispose()
          if ($files.Count -ne 3) { throw "the zip should hold 3 files, it holds $($files.Count)" }
          "{0:N0} MB" -f ((Get-Item P5Manager-windows-x64.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: P5Manager-windows-x64
          path: P5Manager-windows-x64.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: P5Manager-windows-x64.zip
